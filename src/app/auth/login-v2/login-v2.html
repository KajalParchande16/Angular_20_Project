<div class="educore-login-viewport">

    <!-- BACKGROUND DECORATIVE ELEMENTS -->
    <div class="ambient-blur-spotlight"></div>

    <!-- TRANSLUCENT GLASS LOGIN CARD -->
    <div class="educore-glass-container">
        <div class="educore-inner-card">

            <!-- INSTITUTIONAL BRANDING HEADER -->
            <div class="educore-header">
                <div class="brand-signature">
                    <span class="material-icons brand-signature-icon">school</span>
                    <span class="brand-signature-text">EduCore Workspace</span>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to your centralized institutional dashboard portal.</p>
            </div>

            <!-- INTERACTIVE LOGIN FORM -->
            <form [formGroup]="loginForm" (submit)="onLoginSubmit($event)" class="educore-form-desk">

                <!-- EMAIL FIELD INPUT MODULE -->
                <div class="educore-field-group">
                    <label for="userEmail">Institutional Email</label>
                    <div class="educore-input-shell">
                        <span class="material-icons educore-leading-icon">mail_outline</span>
                        <input id="userEmail" type="email" name="email" formControlName="email" required
                            placeholder="name@educore.edu" class="educore-native-input" />
                    </div>
                </div>

                <!-- PASSWORD FIELD INPUT MODULE -->
                <div class="educore-field-group">
                    <div class="educore-label-row">
                        <label for="userPassword">Security Token Key</label>
                        <a href="javascript:void(0)" class="educore-recovery-anchor">Forgot?</a>
                    </div>
                    <div class="educore-input-shell">
                        <span class="material-icons educore-leading-icon">lock_open</span>
                        <input id="userPassword" [type]="showPassword() ? 'text' : 'password'" name="password"
                            formControlName="password" required placeholder="••••••••••••"
                            class="educore-native-input" />
                        <button type="button" (click)="togglePasswordVisibility()" class="educore-visibility-trigger">
                            <span class="material-icons">
                                {{ showPassword() ? 'visibility_off' : 'visibility' }}
                            </span>
                        </button>
                    </div>
                </div>

                <!-- UTILITY SESSION KEEP ROW -->
                <div class="educore-util-row">
                    <label class="educore-checkbox-label">
                        <input type="checkbox" name="rememberMe" />
                        <span class="educore-custom-box"></span>
                        <span class="educore-checkbox-text">Keep me logged in</span>
                    </label>
                </div>

                <!-- CUSTOM THEMED PRIMARY BLUE BUTTON -->
                <button type="submit" [disabled]="isLoading()" class="educore-submit-trigger">

                    @if (isLoading()) {
                    <span class="educore-loading-spinner"></span>
                    <span>Verifying Credentials...</span>
                    } @else {
                    <span>Sign In to Dashboard</span>
                    <span class="material-icons educore-arrow-icon">arrow_forward</span>
                    }
                </button>
            </form>

            <!-- ENCRYPTED SYSTEM NOTES FOOTER -->
            <div class="educore-security-footer">
                <span class="material-icons security-badge-icon">shield</span>
                <span>TLS 1.3 SECURE TRANSACTION LINK</span>
            </div>

        </div>
    </div>

</div>
