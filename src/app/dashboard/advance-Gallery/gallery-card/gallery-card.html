<div class="gallery-card shadow-sm rounded-4 p-3 bg-white">

  <h5 class="fw-bold mb-3">{{ gallery.title }}</h5>

  <div class="row g-3">

    @for(img of gallery.images; track $index){

      <div class="col-6 col-md-4">

        <div class="img-wrapper position-relative">

          <!-- Image -->
          <img
            [src]="sanitizeUrl(img)"
            class="gallery-img w-100 rounded-4"
          />

          <!-- Heart Icon -->
          <button
            class="btn btn-light icon-btn heart-btn"
            (click)="toggleLike(img)">
            ❤️
          </button>

          <!-- Option Menu -->
          <div class="dropdown option-btn">

            <button
              class="btn btn-light icon-btn"
              data-bs-toggle="dropdown">
              ⋮
            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow">

              <li>
                <a class="dropdown-item"
                   (click)="editGallery.emit(img)">
                  Edit
                </a>
              </li>

              <li>
                <a class="dropdown-item text-danger"
                   (click)="deleteGallery.emit(img)">
                  Delete
                </a>
              </li>

            </ul>

          </div>

        </div>

      </div>

    }

  </div>

</div>
