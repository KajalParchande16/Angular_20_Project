<nav class="navbar navbar-expand-lg custom-navbar sticky-top">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center gap-3" routerLink="/">
      <img src="assets/images/logo.jpeg" class="logo-img" alt="Logo">
      <div>
        <h4 class="brand-title mb-0">God Grace School</h4>
        <small class="brand-sub">Learn • Grow • Lead</small>
      </div>
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

        <li class="nav-item">
          <a class="nav-link" routerLink="/">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/about-up">About</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/notice">Notices</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/gallery">Gallery</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/contact-us">Contact</a>
        </li>

        <!-- Dropdown -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            More
          </a>

          <ul class="dropdown-menu dropdown-menu-end custom-dropdown shadow-lg border-0">

            <li><a class="dropdown-item" routerLink="/teacher">Teachers</a></li>
            <li><a class="dropdown-item" routerLink="/event">Events</a></li>
            <li><a class="dropdown-item" routerLink="/admission">Admission</a></li>
            <li><a class="dropdown-item" routerLink="/privacy-policy">Privacy Policy</a></li>
            <li><a class="dropdown-item" routerLink="/dashboard">Dashboard</a></li>

            <li>
              <hr class="dropdown-divider">
            </li>

            <li>
              <a class="dropdown-item text-danger pointer" *ngIf="cs.isLoggedIn()" (click)="logOut()">
                Logout
              </a>
            </li>

          </ul>
        </li>

        <!-- Theme -->
        <li class="nav-item ms-lg-2">
          <button class="theme-btn" (click)="toggleTheme()">
            {{ isDark ? '☀' : '🌙' }}
          </button>
        </li>

      </ul>
    </div>
  </div>
</nav>
