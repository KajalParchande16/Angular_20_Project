<!-- MODERN SCHOOL HEADER -->
<header class="school-header sticky-top">

  <div class="container">

    <nav class="navbar navbar-expand-lg p-0">

      <!-- BRAND -->
      <a routerLink="/" class="navbar-brand brand-wrap">

        <div class="logo-ring">
          <img src="assets/images/logo.jpeg" alt="logo">
        </div>

        <div class="brand-content">
          <h4>God Grace School</h4>
          <span>Inspiring Bright Futures</span>
        </div>

      </a>

      <!-- MOBILE TOGGLE -->
      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
        data-bs-target="#mainMenu">

        <span class="navbar-toggler-icon"></span>

      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse justify-content-end" id="mainMenu" #navbar>

        <ul class="navbar-nav align-items-lg-center gap-lg-2">

          <li class="nav-item">
            <a routerLink="/" class="nav-link active-link">Home</a>
          </li>

          <li class="nav-item">
            <a routerLink="/about-up" class="nav-link">About</a>
          </li>

          <li class="nav-item">
            <a routerLink="/admission" class="nav-link">Admission</a>
          </li>

          <li class="nav-item">
            <a routerLink="/event" class="nav-link">Events</a>
          </li>

          <li class="nav-item">
            <a routerLink="/gallery" class="nav-link">Gallery</a>
          </li>

          <li class="nav-item">
            <a routerLink="/teacher" class="nav-link">Teachers</a>
          </li>

          <!-- DROPDOWN -->
          <li class="nav-item dropdown">

            <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">

              More
            </a>

            <ul class="dropdown-menu custom-drop">

              <li>
                <a routerLink="/notice" class="dropdown-item">Notices</a>
              </li>

              <li>
                <a routerLink="/contact-us" class="dropdown-item">
                  Contact Us
                </a>
              </li>

              <li>
                <a routerLink="/privacy-policy" class="dropdown-item">
                  Privacy Policy
                </a>
              </li>

              <li>
                <a routerLink="/dashboard" class="dropdown-item">
                  Dashboard
                </a>
              </li>
              <li>
                <a class="dropdown-item" *ngIf="cs.isLoggedIn()" (click)="logOut()">
                  Logout
                </a>
              </li>

            </ul>

          </li>

          <!-- CTA -->
          <li class="nav-item ms-lg-3 mt-3 mt-lg-0">

            <a routerLink="/admission" class="admission-btn">
              Apply Now
            </a>

          </li>

        </ul>

      </div>

    </nav>

  </div>

</header>
